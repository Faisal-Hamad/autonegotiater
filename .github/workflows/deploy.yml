name: Deploy

# Runs the tests on GitHub's runner, then deploys to the server over SSH.
# Only the services whose folders changed are rebuilt.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # 1) Unit and API tests against a real PostgreSQL database, with a coverage report.
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: autoneg
          POSTGRES_PASSWORD: autoneg
          POSTGRES_DB: autoneg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autoneg -d autoneg_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://autoneg:autoneg@localhost:5432/autoneg_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov httpx
      - name: Run tests with coverage
        run: python -m pytest tests -q --junitxml=test-results.xml --cov=app --cov-report=term --cov-report=html:coverage-html
      - name: Save test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/test-results.xml
            backend/coverage-html

  # 2) Frontend type check, then the whole system in a real browser (Playwright).
  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: autoneg
          POSTGRES_PASSWORD: autoneg
          POSTGRES_DB: autoneg_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autoneg -d autoneg_e2e" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://autoneg:autoneg@localhost:5432/autoneg_e2e
      AUTH_COOKIE_SECURE: "false"
      AUTH_ALLOWED_ORIGINS: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type check and build the frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
      - name: Start the backend with test accounts
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m tests.seed_data
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
      - name: Start the frontend
        working-directory: frontend/.next/standalone
        run: HOSTNAME=127.0.0.1 PORT=3000 nohup node server.js > ../../../frontend.log 2>&1 &
      - name: Install Playwright
        working-directory: e2e
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: e2e
        run: |
          curl -fsS --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:3000/api/health
          python -m pytest -q --browser chromium --junitxml=e2e-results.xml --screenshot only-on-failure --output test-output
      - name: Save browser test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: |
            e2e/e2e-results.xml
            e2e/test-output
            backend.log
            frontend.log

  # 3) Deploy only when every test passed.
  deploy:
    needs: [backend-tests, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide which services to rebuild
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Manual run, first push, or unknown base → rebuild everything.
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "services=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "Changed files:"; echo "$files"

          services=""
          if echo "$files" | grep -q '^infra/compose.yaml$'; then
            services="all"
          else
            echo "$files" | grep -q '^backend/'   && services="$services fastapi celery-worker"
            echo "$files" | grep -q '^frontend/'  && services="$services nextjs"
          fi
          nginx=false
          echo "$files" | grep -q '^infra/nginx/' && nginx=true

          echo "services=${services# }" >> "$GITHUB_OUTPUT"
          echo "nginx=$nginx" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Fingerprint only (safe to print). Compare with: ssh-keygen -lf github_actions.pub
          echo "Deploy key fingerprint:"; ssh-keygen -lf ~/.ssh/id_deploy

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          PROJECT_DIR: ${{ secrets.PROJECT_DIR }}
          SERVICES: ${{ steps.changes.outputs.services }}
          NGINX: ${{ steps.changes.outputs.nginx }}
        run: |
          # Print the runner's public IP so a timeout can be checked against the server firewall.
          echo "Runner public IP: $(curl -fsS https://api.ipify.org || echo unknown)"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "PROJECT_DIR='$PROJECT_DIR' SERVICES='$SERVICES' NGINX='$NGINX' bash -s" <<'REMOTE'
          set -euo pipefail
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          cd "$PROJECT_DIR"

          git fetch origin main
          git reset --hard origin/main
          echo "Deployed commit: $(git log -1 --oneline)"

          compose="podman-compose -f infra/compose.yaml"
          if [ "$SERVICES" = "all" ]; then
            echo "Rebuilding all services"
            $compose up -d --build --force-recreate
          elif [ -n "$SERVICES" ]; then
            echo "Rebuilding: $SERVICES"
            $compose build $SERVICES
            # Podman refuses to replace a container that others depend on
            # (problems.md 19 and 26): nginx -> nextjs -> fastapi. Remove the
            # dependents first, then recreate everything that was removed.
            targets="$SERVICES"
            case " $SERVICES " in *" fastapi "*) targets="$targets nextjs";; esac
            podman rm -f autoneg-nginx
            for s in nextjs celery-worker fastapi; do
              case " $targets " in
                *" $s "*) podman rm -f "autoneg-${s%-worker}" ;;
              esac
            done
            for s in fastapi celery-worker nextjs; do
              case " $targets " in
                *" $s "*) $compose up -d --no-deps "$s" ;;
              esac
            done
            $compose up -d --no-deps nginx
          else
            echo "No service code changed, nothing to rebuild"
          fi

          # nginx caches container IPs and reads its config at start:
          # restart it after any rebuild or nginx config change.
          if [ -n "$SERVICES" ] || [ "$NGINX" = "true" ]; then
            podman restart autoneg-nginx
          fi

          podman image prune -f >/dev/null
          curl -fsSk --retry 10 --retry-delay 3 --retry-all-errors https://localhost/api/health
          echo
          podman ps --format '{{.Names}}\t{{.Status}}'
          REMOTE
