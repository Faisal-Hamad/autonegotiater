# Cloudflare (Full Strict) → this nginx → containers on the Podman network.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name autonegotiater.com www.autonegotiater.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # FastAPI (the /api prefix is stripped; FastAPI uses root_path=/api)
    location /api/ {
        proxy_pass http://fastapi:8000/;
        # WebSocket support for live notifications (week 11)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }

    # Uploaded product images
    location /media/ {
        alias /srv/media/;
        expires 7d;
    }

    # Next.js
    location / {
        proxy_pass http://nextjs:3000;
    }
}
